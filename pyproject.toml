[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "paige-triage-agent"
version = "1.0.0"
description = "Faithful Paige (PagerDuty SRE Agent) style triage agent: durable supervisor, hypothesis sub-agents, priority mailbox, memory, connectors, skills."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.6",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
  "typer>=0.12",
  "rich>=13.7",
  "langgraph>=0.2",
  "langgraph-checkpoint-sqlite>=2.0",
  "langchain-core>=0.3",
  "langchain-ollama>=0.2",
]

[project.optional-dependencies]
llm = ["openai>=1.40"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[project.scripts]
paige-triage = "paige_triage.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["paige_triage*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
